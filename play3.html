<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>播放器 · 独立测试</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 20px;
        }
        .test-info {
            color: #b0a090;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            padding: 12px 24px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .test-info .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 10px;
            font-size: 12px;
            margin: 0 4px;
        }
        .test-info .badge.ok { background: #2a7a4a; color: #fff; }
        .test-info .badge.fail { background: #8b2500; color: #fff; }
        .test-info .badge.info { background: #6a3a8a; color: #fff; }

        /* ---- 播放器样式（独立命名空间） ---- */
        #playerToggleWrapper {
            position: fixed;
            bottom: 30px;
            left: 20px;
            z-index: 99999;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: grab;
            touch-action: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #playerToggleWrapper .player-music-toggle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #6b3a2a;
            color: #e8d5c0;
            border: 2px solid #c23531;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        #playerToggleWrapper .player-music-toggle:hover {
            transform: scale(1.05);
        }
        #playerToggleWrapper.player-playing {
            animation: player-spin 2s linear infinite;
        }
        @keyframes player-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #playerToggleWrapper.player-playing .player-music-toggle {
            animation: player-breath 1.2s ease-in-out infinite;
        }
        @keyframes player-breath {
            0%,100% { transform: scale(1); box-shadow: 0 0 20px rgba(194,53,49,0.25); }
            50% { transform: scale(1.12); box-shadow: 0 0 35px rgba(194,53,49,0.5), 0 0 70px rgba(194,53,49,0.15); }
        }
        #playerToggleWrapper.player-playing::before,
        #playerToggleWrapper.player-playing::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid rgba(194,53,49,0.25);
            animation: player-wave-expand 1.5s ease-out infinite;
            pointer-events: none;
        }
        #playerToggleWrapper.player-playing::after { animation-delay: 0.5s; }
        @keyframes player-wave-expand {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        #playerPanel {
            position: fixed;
            z-index: 99998;
            width: 220px;
            background: rgba(60,40,30,0.88);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(154,106,84,0.5);
            display: none;
            color: #e8d5c0;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #playerPanel.player-open { display: block; }
        #playerPanel .player-song-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 6px;
            height: 22px;
        }
        #playerPanel .player-song-name {
            display: inline-block;
            font-size: 14px;
            color: #e8d5c0;
            font-family: '华文楷体','KaiTi',serif;
            letter-spacing: 1px;
            white-space: nowrap;
            transform: translateX(0);
        }
        #playerPanel .player-song-name.player-scrolling {
            animation: player-scroll-text 10s linear infinite;
        }
        @keyframes player-scroll-text {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        #playerPanel .player-spectrum-area {
            height: 32px;
            margin-bottom: 6px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            padding: 2px 4px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            overflow: hidden;
        }
        #playerPanel .player-progress-area {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }
        #playerPanel .player-progress-time {
            font-size: 10px;
            color: #b0a090;
            font-family: monospace;
            min-width: 28px;
        }
        #playerPanel .player-progress-wrap {
            flex: 1;
            height: 4px;
            background: rgba(255,215,140,0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            touch-action: none;
        }
        #playerPanel .player-progress-bar {
            height: 100%;
            width: 0%;
            background: #c23531;
            border-radius: 4px;
            position: relative;
            transition: width 0.05s linear;
        }
        #playerPanel .player-progress-dot {
            position: absolute;
            top: 50%;
            right: -6px;
            transform: translate(50%,-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #c23531;
            border: 2px solid #e8d5c0;
            box-shadow: 0 0 10px rgba(194,53,49,0.4);
            pointer-events: none;
            display: none;
        }
        #playerPanel .player-progress-dot.player-show { display: block; }

        #playerPanel .player-mode-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: nowrap;
        }
        #playerPanel .player-mode-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: #8a7a6a;
            font-size: 11px;
            padding: 2px 10px;
            cursor: pointer;
            transition: 0.2s;
            font-family: '华文楷体','KaiTi',serif;
            letter-spacing: 1px;
            min-height: 24px;
            white-space: nowrap;
            background-color: transparent;
            pointer-events: auto;
        }
        #playerPanel .player-mode-btn.player-active {
            background: #c23531;
            color: #fff;
            border-color: #c23531;
        }
        #playerPanel .player-mode-btn:hover {
            background: rgba(194,53,49,0.15);
        }

        #playerPanel .player-effect-toggle-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: #8a7a6a;
            font-size: 11px;
            padding: 2px 10px;
            cursor: pointer;
            transition: 0.2s;
            font-family: '华文楷体','KaiTi',serif;
            letter-spacing: 1px;
            min-height: 24px;
            white-space: nowrap;
            background-color: transparent;
            pointer-events: auto;
        }
        #playerPanel .player-effect-toggle-btn.player-active {
            background: #c23531;
            color: #fff;
            border-color: #c23531;
        }
        #playerPanel .player-effect-toggle-btn:hover {
            background: rgba(194,53,49,0.15);
        }

        #playerPanel .player-panel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            height: 36px;
            line-height: 1;
        }
        #playerPanel .player-panel-controls button {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
            -webkit-appearance: none;
            appearance: none;
            color: #e8d5c0;
            cursor: pointer;
            padding: 0;
            min-width: 36px;
            min-height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: color 0.15s, transform 0.2s;
            pointer-events: auto;
            background: transparent !important;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }
        #playerPanel .player-panel-controls button:hover {
            color: #c23531;
            transform: scale(1.06);
        }
        #playerPanel .player-panel-controls button:active,
        #playerPanel .player-panel-controls button:focus {
            background: transparent !important;
            border-color: inherit !important;
            box-shadow: none !important;
        }
        #playerPanel .player-panel-controls .player-play-btn {
            font-size: 18px;
        }
        #playerPanel .player-panel-controls .player-play-btn.player-paused {
            font-size: 0;
        }
        #playerPanel .player-panel-controls .player-play-btn.player-paused::before,
        #playerPanel .player-panel-controls .player-play-btn.player-paused::after {
            content: '';
            display: block;
            width: 3px;
            height: 14px;
            background: #e8d5c0;
            border-radius: 1.5px;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        #playerPanel .player-panel-controls .player-play-btn.player-paused::before { margin-right: 3px; }
        #playerPanel .player-panel-controls .player-play-btn.player-paused:hover::before,
        #playerPanel .player-panel-controls .player-play-btn.player-paused:hover::after {
            background: #c23531;
        }
        #playerPanel .player-panel-controls .player-play-btn.player-playing {
            font-size: 18px;
        }
        #playerPanel .player-panel-controls .player-play-btn.player-playing::before,
        #playerPanel .player-panel-controls .player-play-btn.player-playing::after {
            display: none;
        }
        #playerPanel .player-panel-controls .player-feedback-red {
            color: #c23531 !important;
        }
        #playerPanel .player-panel-controls .player-play-btn.player-paused.player-feedback-red::before,
        #playerPanel .player-panel-controls .player-play-btn.player-paused.player-feedback-red::after {
            background: #c23531 !important;
        }

        #playerEffectPanel {
            position: fixed;
            z-index: 99997;
            width: 220px;
            background: rgba(40,30,20,0.92);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid rgba(122,74,52,0.5);
            display: none;
            color: #e8d5c0;
            max-height: 320px;
            overflow-y: auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #playerEffectPanel.player-open { display: block; }
        #playerEffectPanel .player-effect-title {
            font-size: 11px;
            color: #b0a090;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
            font-family: '华文楷体','KaiTi',serif;
            border-bottom: 1px solid rgba(255,215,140,0.1);
            padding-bottom: 4px;
        }
        #playerEffectPanel .player-effect-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
        }
        #playerEffectPanel .player-effect-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #b0a090;
            font-size: 9px;
            padding: 3px 8px;
            cursor: pointer;
            transition: 0.2s;
            font-family: '华文楷体','KaiTi',serif;
            letter-spacing: 0.5px;
            white-space: nowrap;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }
        #playerEffectPanel .player-effect-btn.player-active {
            background: #c23531;
            color: #fff;
            border-color: #c23531;
        }
        #playerEffectPanel .player-effect-btn:hover {
            background: rgba(194,53,49,0.2);
        }
        #playerEffectPanel .player-effect-btn:active,
        #playerEffectPanel .player-effect-btn:focus {
            background: rgba(255,255,255,0.08) !important;
            border-color: rgba(255,255,255,0.06) !important;
            box-shadow: none !important;
        }
        #playerEffectPanel .player-effect-btn.player-active:active,
        #playerEffectPanel .player-effect-btn.player-active:focus {
            background: #c23531 !important;
            border-color: #c23531 !important;
        }
        #playerEffectPanel .player-effect-confirm-row {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255,215,140,0.1);
            padding-top: 8px;
        }
        #playerEffectPanel .player-effect-confirm-btn {
            background: #c23531;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 11px;
            padding: 4px 20px;
            cursor: pointer;
            font-family: '华文楷体','KaiTi',serif;
            letter-spacing: 1px;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }
        #playerEffectPanel .player-effect-confirm-btn:hover {
            background: #a02a26;
        }
        #playerEffectPanel .player-effect-confirm-btn:active,
        #playerEffectPanel .player-effect-confirm-btn:focus {
            background: #c23531 !important;
            box-shadow: none !important;
        }
        #playerEffectPanel::-webkit-scrollbar { width: 3px; }
        #playerEffectPanel::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 2px; }
        #playerEffectPanel::-webkit-scrollbar-thumb { background: #c23531; border-radius: 2px; }

        /* ============================================================
           移动端自适应：面板宽度 220px，按钮尺寸保持原始值
           ============================================================ */
        @media (max-width: 400px) {
            #playerPanel {
                width: 220px;
                padding: 14px 16px;
                border-radius: 16px;
            }
            #playerPanel .player-song-name {
                font-size: 14px;
            }
            #playerEffectPanel {
                width: 220px;
                padding: 12px 14px;
                border-radius: 16px;
            }
            #playerPanel .player-panel-controls button {
                min-width: 36px;
                min-height: 36px;
                font-size: 18px;
            }
            #playerPanel .player-panel-controls .player-play-btn {
                font-size: 18px;
            }
            #playerPanel .player-panel-controls .player-play-btn.player-paused::before,
            #playerPanel .player-panel-controls .player-play-btn.player-paused::after {
                height: 14px;
                width: 3px;
            }
            #playerPanel .player-mode-btn,
            #playerPanel .player-effect-toggle-btn {
                font-size: 11px;
                padding: 2px 10px;
                min-height: 24px;
            }
            #playerEffectPanel .player-effect-btn {
                font-size: 9px;
                padding: 3px 8px;
            }
            #playerEffectPanel .player-effect-confirm-btn {
                font-size: 11px;
                padding: 4px 20px;
            }
            #playerPanel .player-progress-time {
                font-size: 10px;
            }
        }

        @media (min-width: 401px) and (max-width: 600px) {
            #playerPanel {
                width: 220px;
                padding: 14px 16px;
                border-radius: 16px;
            }
            #playerPanel .player-song-name {
                font-size: 14px;
            }
            #playerEffectPanel {
                width: 220px;
                padding: 12px 14px;
                border-radius: 16px;
            }
            #playerPanel .player-panel-controls button {
                min-width: 36px;
                min-height: 36px;
                font-size: 18px;
            }
            #playerPanel .player-panel-controls .player-play-btn {
                font-size: 18px;
            }
            #playerPanel .player-panel-controls .player-play-btn.player-paused::before,
            #playerPanel .player-panel-controls .player-play-btn.player-paused::after {
                height: 14px;
                width: 3px;
            }
            #playerPanel .player-mode-btn,
            #playerPanel .player-effect-toggle-btn {
                font-size: 11px;
                padding: 2px 10px;
                min-height: 24px;
            }
            #playerEffectPanel .player-effect-btn {
                font-size: 9px;
                padding: 3px 8px;
            }
            #playerEffectPanel .player-effect-confirm-btn {
                font-size: 11px;
                padding: 4px 20px;
            }
            #playerPanel .player-progress-time {
                font-size: 10px;
            }
        }

        @media (min-width: 601px) and (max-width: 768px) {
            #playerPanel { width: 220px; }
            #playerEffectPanel { width: 220px; }
        }

        @media (max-width: 768px) {
            #playerToggleWrapper { z-index: 99999; }
            #playerPanel { z-index: 99998; }
            #playerEffectPanel { z-index: 99997; }
        }
    </style>
</head>
<body>

    <div class="test-info">
        🎵 独立播放器测试 · 直接读取 config.json
        <span class="badge ok">✅ 配置驱动</span>
        <span class="badge info">📁 不拼接路径</span>
        <span class="badge info">📱 自适应 220px</span>
        <span class="badge info">🖱️ 拖拽修复</span>
    </div>

    <!-- ===== 播放器 HTML 结构 ===== -->
    <div id="playerToggleWrapper">
        <div class="player-music-toggle" id="playerMusicToggle">🎵</div>
    </div>

    <div id="playerPanel">
        <div class="player-song-wrap">
            <span class="player-song-name" id="playerSongName">🎵 加载中...</span>
        </div>
        <div class="player-spectrum-area" id="playerSpectrumArea"></div>
        <div class="player-progress-area">
            <span class="player-progress-time" id="playerCurrentTime">00:00</span>
            <div class="player-progress-wrap" id="playerProgressWrap">
                <div class="player-progress-bar" id="playerProgressBar">
                    <div class="player-progress-dot" id="playerProgressDot"></div>
                </div>
            </div>
            <span class="player-progress-time" id="playerTotalTime">03:00</span>
        </div>
        <div class="player-mode-row">
            <button class="player-mode-btn" data-mode="single">单循</button>
            <button class="player-mode-btn player-active" data-mode="order">循环</button>
            <button class="player-mode-btn" data-mode="random">随机</button>
            <button class="player-effect-toggle-btn" id="playerEffectToggleBtn">效果</button>
        </div>
        <div class="player-panel-controls">
            <button id="playerPrevBtn">⏮</button>
            <button class="player-play-btn player-playing" id="playerPlayBtn">▶</button>
            <button id="playerNextBtn">⏭</button>
        </div>
    </div>

    <div id="playerEffectPanel">
        <div class="player-effect-title">✦ 频谱效果 ✦</div>
        <div class="player-effect-grid" id="playerEffectGrid"></div>
        <div class="player-effect-confirm-row">
            <button class="player-effect-confirm-btn" id="playerEffectConfirmBtn">确定</button>
        </div>
    </div>

    <script src="player.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            window.initPlayer({});
        });
    </script>

</body>
</html>
